{% extends 'base.html' %}
{% load static %}
{% block title %}Sign in · {{ APP_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark" aria-hidden="true"><img src="{% static 'favicon.svg' %}" alt="" width="22" height="22"></div>
    <div class="brand-name">{{ APP_NAME }}</div>
  </div>

  <h1>Sign in</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="form-row">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus required>
      {{ form.username.errors }}
    </div>

    <div class="form-row">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
      {{ form.password.errors }}
    </div>

    <button class="btn btn-primary" type="submit" style="width:100%; margin-top: 6px;">Sign in</button>
  </form>

  <div class="auth-foot">
    No account? <a href="{% url 'register' %}">Create one</a>
  </div>
</div>
{% endblock %}
