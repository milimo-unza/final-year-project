{% extends 'base.html' %}
{% block title %}Create account · {{ APP_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 20 Q5 4 20 4"/>
        <line x1="5" y1="20" x2="20" y2="20"/>
        <line x1="20" y1="4" x2="20" y2="20"/>
        <line x1="9" y1="20" x2="9" y2="11"/>
        <line x1="13" y1="20" x2="13" y2="7"/>
        <line x1="17" y1="20" x2="17" y2="5"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">{{ APP_NAME }}</div>
      <div class="brand-sub mono">{{ APP_TAGLINE }}</div>
    </div>
  </div>
  <h1>Create account</h1>
  <p class="meta">Pick a username, set a password.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit" style="width:100%;">Create account</button>
  </form>

  <div class="auth-foot">
    Already have one? <a href="{% url 'login' %}">Sign in</a>
  </div>
</div>
{% endblock %}
