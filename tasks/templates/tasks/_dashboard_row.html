{% load harpr_extras %}
<div class="task-row "
     data-task-id="{{ t.pk }}"
     data-section="{{ section }}"
     data-remove-on-complete="1">
  <form method="post" action="{% url 'task_toggle' t.pk %}" class="task-form-toggle" data-ajax-toggle>
    {% csrf_token %}
    <input type="hidden" name="next" value="{% url 'dashboard' %}">
    <button type="submit" class="checkbox-btn" aria-label="Mark done"></button>
  </form>
  <div class="task-main">
    <div class="task-title">
      <a href="{% url 'task_edit' t.pk %}" data-modal="task-edit">{{ t.title }}</a>
      <span class="dot-priority dot-{{ t.priority }}" title="{{ t.get_priority_display }}"></span>
      <span class="pill {{ t.priority }} desktop-only">{{ t.get_priority_display }}</span>
    </div>
    <div class="task-meta">
      {% if t.due_date %}{{ t.due_date|date:"H:i" }}{% if t.duration_minutes %}<span class="sep">·</span>{{ t.duration_minutes }}m{% endif %}{% endif %}
      {% with logged=t.total_minutes %}{% if logged %}<span class="sep">·</span><span class="text-muted">{{ logged }}m logged</span>{% endif %}{% endwith %}
    </div>
  </div>
</div>
