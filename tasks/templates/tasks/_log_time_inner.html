{% load static %}
<form method="post" action="{% url 'log_time' task.pk %}" class="form-grid log-time-form">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <input type="hidden" name="next" value="{{ request.META.HTTP_REFERER|default:'' }}">

  <div class="form-row two-up">
    <div>
      <label for="{{ form.hours.id_for_label }}">Hours</label>
      {{ form.hours }}
    </div>
    <div>
      <label for="{{ form.minutes_part.id_for_label }}">Minutes</label>
      {{ form.minutes_part }}
    </div>
  </div>

  <div class="form-row">
    <label for="{{ form.note.id_for_label }}">Note (optional)</label>
    {{ form.note }}
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save entry</button>
    <button type="button" class="btn btn-ghost modal-close">Cancel</button>
  </div>
</form>
